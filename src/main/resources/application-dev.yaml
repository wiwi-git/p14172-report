# 개발 환경: 로컬 MySQL(docker mysql-1) 사용
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/p14172wi?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
