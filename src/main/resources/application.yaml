# 모든 환경에 공통으로 적용되는 설정
# 환경별 설정은 application-{profile}.yaml 에 둔다 (dev, test)
spring:
  application:
    name: p14172-wi

  profiles:
    # 따로 지정하지 않으면 dev 로 실행 (SPRING_PROFILES_ACTIVE 로 변경 가능)
    active: dev

  # 프로젝트 루트의 .env(커밋 제외)에서 DB_USERNAME, DB_PASSWORD 등을 읽음
  config:
    import: optional:file:.env[.properties]

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
