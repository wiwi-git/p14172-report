# 테스트 환경: H2 인메모리 DB(MySQL 호환 모드) 사용
# 외부 DB 없이 실행되고, 테스트가 끝나면 데이터가 사라진다
spring:
  datasource:
    url: jdbc:h2:mem:p14172wi_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
